apiVersion: v1
kind: Pod
metadata:
  name: bi-dss-loader
  namespace: bi-dss
  labels:
    app.kubernetes.io/name: bi-dss-loader
    app.kubernetes.io/part-of: bi-dss
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: bi-dss-toolbox:1.0.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: bi-dss-data
