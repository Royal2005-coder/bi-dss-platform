name: bi_dss
version: "1.0.0"
config-version: 2

profile: bi_dss

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  bi_dss:
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  bi_dss:
    +schema: seeds
    airport_master:
      +column_types:
        airport_code: VARCHAR
        airport_name: VARCHAR
        city: VARCHAR
        state_code: VARCHAR
        state_name: VARCHAR
        region: VARCHAR
        region_name: VARCHAR
        country_code: VARCHAR
        latitude: DOUBLE
        longitude: DOUBLE
        data_source: VARCHAR
